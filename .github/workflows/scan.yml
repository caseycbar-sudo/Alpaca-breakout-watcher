name: Alpaca breakout watcher

on:
  workflow_dispatch:
  schedule:
    # Every five minutes from 4 a.m. through 6 p.m. Eastern across DST changes.
    # The code and Alpaca market clock gate weekends, holidays, premarket, and regular hours.
    - cron: "*/5 8-22 * * 1-5"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "docs/**"
      - "macos/**"
      - "requirements.txt"
      - ".github/workflows/scan.yml"
      - ".github/workflows/pages.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "docs/**"
      - "macos/**"
      - "requirements.txt"
      - ".github/workflows/scan.yml"
      - ".github/workflows/pages.yml"

permissions:
  contents: write

concurrency:
  group: alpaca-breakout-watcher
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate Mac controls
        run: bash -n macos/*.command macos/run_watcher.sh
      - run: python -m pytest -q
      - name: Run read-only scan and paper lab
        if: github.event_name != 'pull_request'
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_DATA_FEED: ${{ vars.ALPACA_DATA_FEED || 'iex' }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: python -m src.main
      - name: Preserve paper ledger and alert state
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          if git diff --quiet -- data/paper_ledger.csv data/premarket_state.json; then
            exit 0
          fi
          git config user.name "alpaca-watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/paper_ledger.csv data/premarket_state.json
          git commit -m "[skip ci] update paper lab and alert state"
          git push
      - name: Package command center
        uses: actions/upload-artifact@v4
        with:
          name: command-center
          path: docs
          retention-days: 1
          if-no-files-found: error
