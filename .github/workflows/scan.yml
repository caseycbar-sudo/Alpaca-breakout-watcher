name: Alpaca breakout watcher

on:
  workflow_dispatch:
  schedule:
    # Every five minutes across U.S. market hours; the Alpaca clock gates holidays/closures.
    - cron: "*/5 13-21 * * 1-5"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/scan.yml"

permissions:
  contents: write

concurrency:
  group: alpaca-breakout-watcher
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Run read-only scan and paper lab
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_DATA_FEED: ${{ vars.ALPACA_DATA_FEED || 'iex' }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python -m src.main
      - name: Preserve paper ledger
        run: |
          if git diff --quiet -- data/paper_ledger.csv; then
            exit 0
          fi
          git config user.name "alpaca-watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/paper_ledger.csv
          git commit -m "[skip ci] update paper ledger"
          git push
