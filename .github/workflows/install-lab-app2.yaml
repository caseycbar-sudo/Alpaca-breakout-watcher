      - name: Add the app to the site
        run: |
          set -euo pipefail
          base64 -d "$RUNNER_TEMP/app.b64" > "$RUNNER_TEMP/app.tgz"
          tar -xzf "$RUNNER_TEMP/app.tgz" -C .
          rm -f .github/workflows/install-lab-app.yml .github/workflows/install-lab-app.yaml

          git config user.name "alpaca-watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A docs/lab .github/workflows
          if git diff --cached --quiet; then
            echo "The app is already installed."
            exit 0
          fi
          git commit -m "Add the backtest lab phone app at /lab/"
          for attempt in 1 2 3; do
            git pull --rebase origin "${{ github.ref_name }}" && git push && break
            sleep $((attempt * 10))
          done
          echo "Installed. The site will publish it in a moment."

      - name: Publish the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref "${{ github.ref_name }}"
