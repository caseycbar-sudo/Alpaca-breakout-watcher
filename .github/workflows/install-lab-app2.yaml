name: Install lab app

# One-time helper. It adds the phone app for the backtest lab to the site,
# at /lab/ , and publishes it. Nothing else in the repo is touched, and the
# helper deletes itself in the same commit.
#
# From a phone: save this file, then upload it to .github/workflows/ .
# The commit starts the job. When it finishes, open
# https://caseycbar-sudo.github.io/Alpaca-breakout-watcher/lab/
# and use Share, then Add to Home Screen.

on:
  push:
    paths:
      - ".github/workflows/install-lab-app*"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: install-lab-app
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

